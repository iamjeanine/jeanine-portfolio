<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stars passage · original reader layout</title><style>
  :root{

  *{box-sizing:border-box}

  /* The sound offer must never block reading: scrolling stays live while

     under this paper and lifts it once the telling is drawing (or at

    z-index:1;
