    <style>
      body {
        font-family: 'Uncut Sans', sans-serif;
        background-color: #F5F2EC;
        color: #1A1A18;
      }
      .font-serif {
        font-family: 'Bodoni Moda', serif;
      }

      /* One shell keyframe survives: shimmer, the VideoPlayer chapter
         title's one-shot gradient sweep. subtle-zoom, fade-in,
         scroll-line, and mute-pulse were orphans from retired components
         (2026-08-21 dead-code sweep, with the unimported ScrollCue). */
      @keyframes shimmer {
        from {
          background-position: 200% center;
        }
        to {
          background-position: -200% center;
        }
      }

      /* Film grain */
      @keyframes grain {
        0%, 100% { transform: translate(0, 0); }
        10% { transform: translate(-5%, -10%); }
        20% { transform: translate(-15%, 5%); }
        30% { transform: translate(7%, -25%); }
        40% { transform: translate(-5%, 25%); }
        50% { transform: translate(-15%, 10%); }
        60% { transform: translate(15%, 0%); }
        70% { transform: translate(0%, 15%); }
        80% { transform: translate(3%, 35%); }
        90% { transform: translate(-10%, 10%); }
      }

      /* View transitions */
      ::view-transition-old(project-hero),
      ::view-transition-new(project-hero) {
        animation-duration: 0.45s;
        animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
      }

      ::view-transition-old(root) {
        animation: vt-fade-out 0.2s ease-out both;
      }

      ::view-transition-new(root) {
        animation: vt-fade-in 0.3s ease-in 0.1s both;
      }

      /* Directional variants: when a navigation moves along the spine
         (deeper into the book = forward, toward the cover = back), the
         route change reads as movement in that direction instead of a
         placeless crossfade. hooks/useViewTransition.ts stamps
         <html data-vt-dir> just before the transition. Old and new run
         together (no delay) so the slide is continuous; the easings are
         mirrored per the reversibility rule: the leaving page accelerates
         away, the arriving page decelerates into place. 28px is a hint of
         motion, not a carousel. The project-hero morph rides on top
         unchanged. */
      html[data-vt-dir="forward"] ::view-transition-old(root) {
        animation: vt-slide-out-left 0.35s cubic-bezier(0.4, 0, 1, 1) both;
      }
      html[data-vt-dir="forward"] ::view-transition-new(root) {
        animation: vt-slide-in-right 0.35s cubic-bezier(0, 0, 0.2, 1) both;
      }
      html[data-vt-dir="back"] ::view-transition-old(root) {
        animation: vt-slide-out-right 0.35s cubic-bezier(0.4, 0, 1, 1) both;
      }
      html[data-vt-dir="back"] ::view-transition-new(root) {
        animation: vt-slide-in-left 0.35s cubic-bezier(0, 0, 0.2, 1) both;
      }

      @keyframes vt-fade-out {
        from { opacity: 1; }
        to { opacity: 0; }
      }

      @keyframes vt-fade-in {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      @keyframes vt-slide-out-left {
        to { opacity: 0; transform: translateX(-28px); }
      }
      @keyframes vt-slide-in-right {
        from { opacity: 0; transform: translateX(28px); }
      }
      @keyframes vt-slide-out-right {
        to { opacity: 0; transform: translateX(28px); }
      }
      @keyframes vt-slide-in-left {
        from { opacity: 0; transform: translateX(-28px); }
      }

      /* Reduced motion. The global flatten finishes every animation in one
         instant pass: iteration-count 1 stops the infinite ambient loops
         (the scroll cue's falling line, the phone hint's pulsing ring),
         and the 0.01s duration turns one-shot entrances into static
         arrivals. !important is required — both loops set their animation
         in inline styles. Transitions are deliberately left alone: the
         remaining ones are opacity and color feedback (hover eases, the
         pressed-state dip), which reduced motion should keep. JS-driven
         motion is handled at its source (LazyVideo posters, parallax,
         ColorBridge, the cover entrance, and preferredScrollBehavior for
         programmatic scrolling — scrollIntoView ignores CSS overrides).
         The ::view-transition rule stays separate: those pseudos live
         outside the tree the * selector reaches. */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01s !important;
          animation-iteration-count: 1 !important;
        }
        .grain-overlay { animation: none !important; }
        ::view-transition-old(*),
        ::view-transition-new(*) { animation-duration: 0.01s !important; }
      }

    </style>
