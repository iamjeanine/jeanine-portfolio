  <style>
    :root {
      --poppy: #FD452D;
      --poppy-deep: #C52D22;
      --signal: #F0FF29;
      --powder: #B8D9E8;
      --paper: #F7F3ED;
      --white: #FFFFFF;
      --ink: #14100E;
      --ink-soft: rgba(20, 16, 14, 0.78);
      --night: #05070C;
      --night-ink: #F7F3ED;
      --night-soft: rgba(247, 243, 237, 0.8);
      --ember: #FF6B57;
      --gutter: clamp(1.25rem, 4vw, 5rem);
      --measure: 65ch;
    }

    @font-face {
      font-family: "Bodoni Moda";
      src: url("/fonts/BodoniModa-Regular-400.ttf") format("truetype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Uncut Sans";
      src: url("/fonts/UncutSans-Regular.woff2") format("woff2");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Uncut Sans";
      src: url("/fonts/UncutSans-Bold.woff2") format("woff2");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      background: var(--paper);
      color: var(--ink);
      accent-color: var(--poppy-deep);
      scrollbar-color: var(--poppy) var(--paper);
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Uncut Sans", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.65;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
    }

    ::selection { background: var(--signal); color: var(--ink); }

    a {
      color: inherit;
      text-underline-offset: 0.22em;
    }

    a:hover { text-decoration-thickness: 0.14em; }

    a:focus-visible {
      outline: 3px solid var(--signal);
      outline-offset: 4px;
    }

    .skip-link {
      position: fixed;
      left: 1rem;
      top: 1rem;
      z-index: 20;
      min-height: 2.75rem;
      display: inline-flex;
      align-items: center;
      transform: translateY(-160%);
      background: var(--signal);
      color: var(--ink);
      padding: 0.65rem 0.9rem;
      font-family: "Uncut Sans", sans-serif;
      font-size: 0.8rem;
    }

    .skip-link:focus { transform: translateY(0); }

    .utility {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 1rem var(--gutter);
      background: var(--poppy);
      border-bottom: 1px solid rgba(20, 16, 14, 0.35);
      font-family: "Uncut Sans", sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      line-height: 1.2;
      text-transform: uppercase;
    }

    .utility-identity,
    .utility nav {
      display: flex;
      align-items: center;
      gap: clamp(1rem, 3vw, 2rem);
    }

    .utility a { min-height: 2.75rem; display: inline-flex; align-items: center; }

    .utility-page {
      padding-left: 0.7rem;
      border-left: 1px solid rgba(20, 16, 14, 0.55);
      font-weight: 700;
    }

    .hero {
      background: var(--poppy);
      padding: clamp(4rem, 9vw, 8rem) var(--gutter) clamp(4.5rem, 9vw, 8rem);
    }

    .hero-grid,
    .chapter-grid,
    .closing-grid {
      width: min(100%, 90rem);
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      column-gap: clamp(1rem, 2.4vw, 2.5rem);
    }

    .hero h1 {
      grid-column: 1 / span 6;
      margin: 0;
      color: var(--white);
      font-family: "Bodoni Moda", Didot, serif;
      font-size: clamp(4rem, 10vw, 6rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 0.88;
    }

    .hero-copy {
      grid-column: 7 / -1;
      align-self: end;
      min-width: 0;
    }

    .hero-name {
      margin: 0 0 1rem;
      font-family: "Uncut Sans", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .throughline {
      max-width: 44rem;
      margin: 0;
      font-size: clamp(1.2rem, 2vw, 1.65rem);
      line-height: 1.48;
      text-wrap: pretty;
      overflow-wrap: break-word;
    }

    .chapter-nav {
      background: var(--powder);
      padding: 1.25rem var(--gutter);
      font-family: "Uncut Sans", sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    .chapter-nav-inner {
      width: min(100%, 90rem);
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem 2.5rem;
    }

    .chapter-nav a { min-height: 2.75rem; display: inline-flex; align-items: center; }

    .chapter {
      padding: clamp(4.5rem, 9vw, 8rem) var(--gutter);
      scroll-margin-top: 1rem;
    }

    .chapter.production { background: var(--white); }
    .chapter.labs { background: var(--night); color: var(--night-ink); }

    .chapter-header { grid-column: 1 / span 4; }

    .chapter-title {
      margin: 0;
      font-family: "Bodoni Moda", Didot, serif;
      font-size: clamp(3rem, 5vw, 4.75rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 0.94;
      text-wrap: balance;
    }

    .chapter-description {
      max-width: 30rem;
      margin: 1.5rem 0 0;
      color: var(--ink-soft);
      font-size: 1.05rem;
      line-height: 1.65;
      text-wrap: pretty;
    }

    .labs .chapter-description { color: var(--night-soft); }

    .chapter-link {
      min-height: 2.75rem;
      display: inline-flex;
      align-items: center;
      margin-top: 1.5rem;
      font-family: "Uncut Sans", sans-serif;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration-color: var(--poppy-deep);
    }

    .labs .chapter-link { text-decoration-color: var(--ember); }

    .work-list {
      grid-column: 5 / -1;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .work-item {
      display: grid;
      grid-template-columns: minmax(13rem, 0.95fr) minmax(0, 1.45fr);
      gap: 0;
      padding: 2rem 0 2.15rem;
      border-top: 1px solid rgba(20, 16, 14, 0.28);
      scroll-margin-top: 1.25rem;
    }

    .labs .work-item { border-top-color: rgba(247, 243, 237, 0.25); }

    .work-title {
      margin: 0;
      font-family: "Bodoni Moda", Didot, serif;
      font-size: clamp(1.65rem, 2.4vw, 2.15rem);
      font-weight: 400;
      line-height: 1.06;
      text-wrap: balance;
    }

    .work-meta,
    .work-role {
      margin: 0;
      font-family: "Uncut Sans", sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.075em;
      line-height: 1.55;
      text-transform: uppercase;
    }

    .work-meta { margin-top: 1.15rem; color: var(--ink-soft); }
    .labs .work-meta { color: var(--night-soft); }
    .work-role { margin-top: 0.45rem; color: var(--poppy-deep); font-weight: 700; }
    .labs .work-role { color: var(--ember); }

    .work-copy {
      min-width: 0;
      padding-left: clamp(1.5rem, 2.5vw, 2.5rem);
      border-left: 1px solid rgba(20, 16, 14, 0.22);
    }
    .labs .work-copy { border-left-color: rgba(247, 243, 237, 0.24); }
    .work-copy p { max-width: var(--measure); margin: 0; }
    .work-proof { margin-top: 0.8rem !important; color: var(--ink-soft); }
    .labs .work-proof { color: var(--night-soft); }

    .project-link {
      min-height: 2.75rem;
      display: inline-flex;
      align-items: center;
      margin-top: 0.75rem;
      font-family: "Uncut Sans", sans-serif;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      text-decoration-color: var(--ember);
    }

    .closing {
      background: var(--poppy);
      padding: clamp(4.5rem, 9vw, 8rem) var(--gutter) clamp(3rem, 6vw, 5rem);
    }

    .closing h2 {
      grid-column: 1 / span 7;
      margin: 0;
      color: var(--white);
      font-family: "Bodoni Moda", Didot, serif;
      font-size: clamp(3rem, 6vw, 5.5rem);
      font-weight: 400;
      letter-spacing: -0.03em;
      line-height: 0.95;
    }

    .closing-links {
      grid-column: 8 / -1;
      align-self: end;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 0.75rem;
      font-size: clamp(1.1rem, 2vw, 1.4rem);
    }

    .closing-links a {
      min-height: 2.75rem;
      display: inline-flex;
      align-items: center;
      text-decoration-color: var(--signal);
      text-decoration-thickness: 2px;
    }

    .closing-meta {
      grid-column: 1 / -1;
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      margin-top: clamp(4rem, 8vw, 7rem);
      padding-top: 1rem;
      border-top: 1px solid rgba(20, 16, 14, 0.35);
      font-family: "Uncut Sans", sans-serif;
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    @media (max-width: 900px) {
      .hero h1,
      .hero-copy,
      .chapter-header,
      .work-list,
      .closing h2,
      .closing-links { grid-column: 1 / -1; }
      .hero-copy { margin-top: 3rem; }
      .work-list { margin-top: 3rem; }
      .closing-links { margin-top: 3rem; }
    }

    @media (max-width: 680px) {
      .hero-grid,
      .chapter-grid,
      .closing-grid {
        display: block;
        width: 100%;
      }
      .throughline,
      .chapter-description,
      .work-copy p { max-width: 100%; }
      .utility { flex-direction: column; align-items: flex-start; gap: 0.25rem; }
      .utility-identity { flex-direction: column; align-items: flex-start; gap: 0.25rem; padding-top: 0.7rem; }
      .utility-page { padding-left: 0; border-left: 0; }
      .utility nav {
        width: 100%;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-start;
        gap: 0 1.25rem;
      }
      .work-item { grid-template-columns: 1fr; gap: 1.25rem; }
      .work-meta { margin-top: 0.8rem; }
      .work-copy { padding-left: 0; border-left: 0; }
      .closing-meta { flex-direction: column; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
